<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صعيد مصر — خلفية تفاعلية</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23090703'/%3E%3Crect x='11' y='11' width='10' height='10' fill='%23c8b89a'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:"Thmanyah Serif Display";src:url("fonts/thmanyahserifdisplay-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
  html,body{margin:0;background:#090703;color:#efe6d6;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif}
  .display{font-family:"Thmanyah Serif Display",serif}
  /* content placed above the animated background */
  .stage{min-height:100svh;display:grid;place-items:center;padding:clamp(24px,6vw,96px) clamp(16px,5vw,80px);box-sizing:border-box}
  .copy{max-width:640px;text-align:start}
  .eyebrow{font-size:15px;letter-spacing:.02em;color:#c8b89a;margin:0 0 12px}
  h1{margin:0;font-size:clamp(52px,7vw,104px);line-height:.95;letter-spacing:-.02em;color:#f4ecdc}
  h1 em{font-style:normal;color:#d9a04a}
  p.lede{font-size:clamp(16px,1.3vw,19px);line-height:1.7;color:rgba(239,230,214,.8);margin:24px 0 32px;max-width:46ch}
  .btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 26px;border-radius:8px;background:#a53e1a;color:#fff;font-weight:700;text-decoration:none;
    box-shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -10px rgba(165,62,26,.8);transition:transform .25s cubic-bezier(.2,.9,.3,1.3),background-color .2s}
  .btn:hover{background:#8a3213;transform:translateY(-1px)} .btn:active{transform:scale(.98)} .btn:focus-visible{outline:3px solid rgba(200,184,154,.6);outline-offset:3px}
  .ghost{margin-inline-start:12px;background:transparent;border:1px solid rgba(200,184,154,.35);color:#efe6d6;box-shadow:none}
  .ghost:hover{background:rgba(200,184,154,.08)}
</style>
</head>
<body>

<!-- Standalone hero usage: fills the viewport, content sits above the canvas -->
<section data-fluid-bg data-standalone data-glow="152,99,0" data-cursor="#c8b89a" data-grain="0.32" aria-label="اكتشف صعيد مصر">
  <div class="stage">
    <div class="copy">
      <p class="eyebrow">حكايات من قلب الصعيد</p>
      <h1 class="display">اكتـــــــشف<br><em>صعيـد مصـر</em></h1>
      <p class="lede">من الأقصر إلى أسوان، اكتشف أماكن وتجارب وحرفاً تحكي قصة الجنوب كما يعيشها أهله.</p>
      <a class="btn" href="index.html#paths">ابدأ الاستكشاف</a>
      <a class="btn ghost" href="index.html#experiences" data-cursor>التجارب</a>
    </div>
  </div>
</section>

<script src="fluid-bg.js"></script>
</body>
</html>
